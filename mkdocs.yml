site_name: xtremax
site_description: JAX/NumPyro-native library for extreme value modeling — custom distributions, Bayesian models, and spatiotemporal data extraction.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/xtremax
repo_name: jejjohnson/xtremax

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # `auto` detects per-docstring: most of the package is Google
            # style, but xtremax/extraction/ is NumPy style. A fixed style
            # leaves the other one unparsed, leaking its section underlines
            # into the page as headings.
            docstring_style: auto
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true

nav:
  - Home: index.md
  - Examples:
      - Extreme Value Distributions:
          - Distributions overview: notebooks/evt_distributions_overview.ipynb
          - "GEVD: annual block maxima": notebooks/evt_gevd_block_maxima.ipynb
          - "Fréchet: heavy-tailed maxima": notebooks/evt_frechet_heavy_tails.ipynb
          - "Weibull: bounded extremes": notebooks/evt_weibull_bounded.ipynb
      - Peaks Over Threshold:
          - "GPD: peaks-over-threshold": notebooks/evt_gpd_pot.ipynb
          - "GPD: quantile-regression threshold": notebooks/evt_quantile_regression_gpd.ipynb
      - Non-stationary EVT:
          - Parametric trend: notebooks/evt_nonstat_parametric.ipynb
          - P-splines: notebooks/evt_nonstat_splines.ipynb
          - Neural ODE: notebooks/evt_nonstat_neural_ode.ipynb
      - "Point Processes: Temporal":
          - Homogeneous Poisson: notebooks/hpp_from_scratch_and_numpyro.ipynb
          - Inhomogeneous Poisson: notebooks/ipp_from_scratch_and_numpyro.ipynb
          - Renewal: notebooks/renewal_from_scratch_and_numpyro.ipynb
          - Hawkes: notebooks/hawkes_from_scratch_and_numpyro.ipynb
          - Marked: notebooks/marked_from_scratch_and_numpyro.ipynb
          - Thinning / observation operator: notebooks/thinning_from_scratch_and_numpyro.ipynb
      - "Point Processes: Spatial":
          - Homogeneous Poisson: notebooks/hpp_spatial_from_scratch_and_numpyro.ipynb
          - Inhomogeneous Poisson: notebooks/ipp_spatial_from_scratch_and_numpyro.ipynb
          - Marked: notebooks/marked_spatial_from_scratch_and_numpyro.ipynb
      - "Point Processes: Spatiotemporal":
          - Homogeneous Poisson: notebooks/hpp_spatiotemporal_from_scratch_and_numpyro.ipynb
          - Inhomogeneous Poisson: notebooks/ipp_spatiotemporal_from_scratch_and_numpyro.ipynb
          - Marked: notebooks/marked_spatiotemporal_from_scratch_and_numpyro.ipynb
          - Hawkes: notebooks/hawkes_spatiotemporal_from_scratch_and_numpyro.ipynb
      - Neural / Advanced:
          - Latent ODE for irregular IPPs: notebooks/latent_ode_ipp.ipynb
  - Design:
      - Overview: design_docs/README.md
      - Vision: design_docs/vision.md
      - Architecture: design_docs/architecture.md
      - Boundaries: design_docs/boundaries.md
      - Decisions: design_docs/decisions.md
      - API:
          - Overview: design_docs/api/README.md
          - Primitives: design_docs/api/primitives.md
          - Components: design_docs/api/components.md
          - Models: design_docs/api/models.md
      - Examples:
          - Overview: design_docs/examples/README.md
          - Primitives: design_docs/examples/primitives.md
          - Components: design_docs/examples/components.md
          - Models: design_docs/examples/models.md
          - Integration: design_docs/examples/integration.md
  - API Reference:
      - Overview: api/index.md
      - Distributions: api/distributions.md
      - Primitives: api/primitives.md
      - Extraction: api/extraction.md
      - "Point Processes — Overview": api/point-processes.md
      - "Point Processes — Primitives": api/point-process-primitives.md
      - "Point Processes — Operators": api/point-process-operators.md
      - "Point Processes — Distributions": api/point-process-distributions.md
      - Simulations: api/simulations.md
  - Interop: interop.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [!relative $docs_dir/..]
      check_paths: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
