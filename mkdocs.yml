# ---------------------------------------------------------------------------
# MkDocs builds ONLY the API reference, which is deployed as the `/reference/`
# subtree of the MyST site. Prose, design docs, and example notebooks are
# built by mystmd from `docs/myst.yml`. See `docs/README.md` for the split and
# the rationale.
#
# mkdocstrings publishes a Sphinx-compatible `objects.inv` into `site/`, and
# that inventory is what lets the MyST prose cross-reference into these pages.
# ---------------------------------------------------------------------------
site_name: xtremax API reference
site_description: API reference for xtremax — JAX/NumPyro-native extreme value modeling.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/xtremax
repo_name: jejjohnson/xtremax

docs_dir: docs/api
site_dir: site

# The prose pages live in the MyST half of the site, so links to them point
# outside `docs_dir` by design. The assembled-site link checker in
# `scripts/build_docs.py` validates them instead — across both halves, which
# neither tool can do on its own.
validation:
  links:
    unrecognized_links: ignore
    absolute_links: ignore

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # `auto` detects per-docstring: most of the package is Google
            # style, but xtremax/extraction/ is NumPy style. A fixed style
            # leaves the other one unparsed, leaking its section underlines
            # into the page as headings.
            docstring_style: auto
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

nav:
  - Overview: index.md
  - Distributions: distributions.md
  - Primitives: primitives.md
  - Extraction: extraction.md
  - "Point Processes — Overview": point-processes.md
  - "Point Processes — Primitives": point-process-primitives.md
  - "Point Processes — Operators": point-process-operators.md
  - "Point Processes — Distributions": point-process-distributions.md
  - Simulations: simulations.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
