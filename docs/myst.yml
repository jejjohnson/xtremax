                - file: tutorials/spatial_extremes/02_pooling/04_many_stations_laplace.ipynb
                - file: tutorials/spatial_extremes/02_pooling/05_hierarchical_pooling.ipynb
                - file: tutorials/spatial_extremes/02_pooling/06_gp_primer.ipynb
            - title: Spatial GEV
              children:
