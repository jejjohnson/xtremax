site:
  title: xtremax
  template: book-theme
  options:
    logo_text: xtremax
  # mystmd requires a full URL here (both `/reference/` and `reference/` are
  # rejected), so the deployed location is hard-coded the way `repo_url` is in
  # mkdocs.yml.
  #
  # Do NOT rewrite this to a root-relative path at build time. The theme
  # re-renders the nav from this config on hydration and prepends BASE_URL to
  # any URL starting with `/`, so a rewritten value becomes
  # `/xtremax/xtremax/reference/` and 404s. An absolute URL is treated as
  # external and left alone. The cost is that a local preview's nav button
  # points at the deployed site.
  nav:
    - title: API reference
      url: https://jejjohnson.github.io/xtremax/reference/
