# ---------------------------------------------------------------------------
# mystmd builds the prose half of the documentation: home page, example
# notebooks, tutorials, design docs, and project pages. The API reference is
# built separately by MkDocs + mkdocstrings and mounted at `/reference/`. See
# `docs/README.md`.
#
# `references.api` points at a LOCAL server because mystmd only loads
# intersphinx inventories over http(s) — a filesystem path is rejected and a
# `file://` URL is silently ignored. `scripts/build_docs.py` serves the freshly
# built MkDocs `site/` on this exact port, then rewrites the resulting
# localhost URLs to the deployed `/reference/` path. Keep the port in sync
# with API_PORT in that script.
#
# Notebooks are committed pre-executed and are NOT re-run by the docs build.
# ---------------------------------------------------------------------------
version: 1

project:
  id: xtremax-docs
  title: xtremax
  description: >-
    JAX/NumPyro-native extreme value modeling — EVT distributions, temporal /
    spatial / spatiotemporal point processes, and xarray-native extremes
    extraction.
  github: https://github.com/jejjohnson/xtremax
  authors:
    - name: J. Emmanuel Johnson
  references:
    api: http://127.0.0.1:8910/
  # Hover tooltips wherever these appear in the prose.
  abbreviations:
    EVT: Extreme value theory
    GEV: Generalized extreme value (distribution)
    GEVD: Generalized extreme value distribution
    GPD: Generalized Pareto distribution
    POT: Peaks over threshold
    HPP: Homogeneous Poisson process
    IPP: Inhomogeneous Poisson process
    LGCP: Log-Gaussian Cox process
    ETAS: Epidemic-type aftershock sequence
    MCMC: Markov chain Monte Carlo
    NUTS: No-U-Turn sampler
    SVI: Stochastic variational inference
    CDS: Copernicus Climate Data Store
    ODE: Ordinary differential equation
    SDE: Stochastic differential equation
  toc:
    - file: index.md
    - title: Examples
      children:
        - title: Extreme Value Distributions
          children:
            - file: notebooks/evt_distributions_overview.ipynb
            - file: notebooks/evt_gevd_block_maxima.ipynb
            - file: notebooks/evt_frechet_heavy_tails.ipynb
            - file: notebooks/evt_weibull_bounded.ipynb
        - title: Peaks Over Threshold
          children:
            - file: notebooks/evt_gpd_pot.ipynb
            - file: notebooks/evt_quantile_regression_gpd.ipynb
        - title: Non-stationary EVT
          children:
            - file: notebooks/evt_nonstat_parametric.ipynb
            - file: notebooks/evt_nonstat_splines.ipynb
            - file: notebooks/evt_nonstat_neural_ode.ipynb
        - title: "Point Processes: Temporal"
          children:
            - file: notebooks/hpp_from_scratch_and_numpyro.ipynb
            - file: notebooks/ipp_from_scratch_and_numpyro.ipynb
            - file: notebooks/renewal_from_scratch_and_numpyro.ipynb
            - file: notebooks/hawkes_from_scratch_and_numpyro.ipynb
            - file: notebooks/marked_from_scratch_and_numpyro.ipynb
            - file: notebooks/thinning_from_scratch_and_numpyro.ipynb
        - title: "Point Processes: Spatial"
          children:
            - file: notebooks/hpp_spatial_from_scratch_and_numpyro.ipynb
            - file: notebooks/ipp_spatial_from_scratch_and_numpyro.ipynb
            - file: notebooks/marked_spatial_from_scratch_and_numpyro.ipynb
        - title: "Point Processes: Spatiotemporal"
          children:
            - file: notebooks/hpp_spatiotemporal_from_scratch_and_numpyro.ipynb
            - file: notebooks/ipp_spatiotemporal_from_scratch_and_numpyro.ipynb
            - file: notebooks/marked_spatiotemporal_from_scratch_and_numpyro.ipynb
            - file: notebooks/hawkes_spatiotemporal_from_scratch_and_numpyro.ipynb
        - title: Neural / Advanced
          children:
            - file: notebooks/latent_ode_ipp.ipynb
    - title: Tutorials
      children:
        - file: tutorials/spatial_extremes.md
          children:
            - title: Data
              children:
                - file: tutorials/spatial_extremes/00_data/00_cds_insitu_iberia.ipynb
            - title: EVT Foundations
              children:
                - file: tutorials/spatial_extremes/01_evt_foundations/01_block_maxima.ipynb
                - file: tutorials/spatial_extremes/01_evt_foundations/02_gev_one_station.ipynb
                - file: tutorials/spatial_extremes/01_evt_foundations/03_extremal_types.ipynb
                - file: tutorials/spatial_extremes/01_evt_foundations/03_return_levels.ipynb
            - title: Pooling & GPs
              children:
